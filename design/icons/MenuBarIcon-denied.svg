<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!-- Menu bar template image: black on transparent only. The warning triangle takes the
       Bluetooth mark's place; its exclamation mark is cut out, not drawn in white. -->
  <defs>
    <path id="triangle" d="M 14.4 1.2 L 17.4 6.6 L 11.4 6.6 Z" stroke-linejoin="round"/>
    <!-- Cuts a thin gap into the tooth around the triangle -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <rect width="18" height="18" fill="#fff"/>
      <use href="#triangle" fill="#000" stroke="#000" stroke-width="3.2"/>
    </mask>
    <!-- Cuts the exclamation mark out of the triangle -->
    <mask id="mark" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <rect width="18" height="18" fill="#fff"/>
      <path d="M 14.4 3.0 L 14.4 4.6" stroke="#000" stroke-width="1.05" stroke-linecap="round"/>
      <circle cx="14.4" cy="5.85" r=".55" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#gap)">
    <path transform="translate(-6.627 -6.657) scale(.03082)" fill="#000" d="M 428 392
      C 400 370 368 352 330 350
      C 270 348 226 392 228 462
      C 230 515 250 550 258 600
      C 266 655 270 715 290 752
      C 304 778 326 788 350 786
      C 378 784 388 756 394 722
      C 402 682 410 650 428 648
      C 446 650 454 682 462 722
      C 468 756 478 784 506 786
      C 530 788 552 778 566 752
      C 586 715 590 655 598 600
      C 606 550 626 515 628 462
      C 630 392 586 348 526 350
      C 488 352 456 370 428 392 Z"/>
  </g>
  <use href="#triangle" fill="#000" stroke="#000" stroke-width="1.2" mask="url(#mark)"/>
</svg>
