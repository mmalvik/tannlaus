name: Changelog

# Separate from CI so that adding or removing the skip-changelog label doesn't rebuild the app.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog updated
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that CHANGELOG.md changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE...$HEAD" | grep -qx CHANGELOG.md; then
            echo "CHANGELOG.md updated."
          else
            echo "::error::Add an entry under [Unreleased] in CHANGELOG.md, or label the PR skip-changelog if it has no user-visible change."
            exit 1
          fi
